<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-label="Delapan langkah umum unlock bootloader: backup data, aktifkan Developer Options, aktifkan OEM unlocking, masuk mode bootloader, verifikasi Fastboot, jalankan perintah unlock vendor, konfirmasi di layar, lalu reset dan reboot">
