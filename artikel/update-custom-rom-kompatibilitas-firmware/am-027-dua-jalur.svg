<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-label="Dua jalur update ROM: lewat updater delapan langkah dan lewat recovery dengan ADB sideload delapan langkah">
  <rect width="1000" height="530" fill="#fff"/>
  <text x="50" y="52" font-family="Consolas, monospace" font-size="22" letter-spacing="2" fill="#000">DUA JALUR UPDATE ROM</text>
  <line x1="50" y1="72" x2="950" y2="72" stroke="#000" stroke-width="4"/>

  <rect x="50" y="100" width="430" height="330" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="50" y="100" width="430" height="50" fill="#ffd400"/>
  <text x="74" y="134" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="1" fill="#000">LEWAT UPDATER</text>
  <text x="74" y="182" font-family="Consolas, monospace" font-size="16" fill="#e30613">01</text>
  <text x="112" y="182" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Baca changelog dan catatan ROM</text>
  <text x="74" y="214" font-family="Consolas, monospace" font-size="16" fill="#e30613">02</text>
  <text x="112" y="214" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Pastikan firmware sesuai</text>
  <text x="74" y="246" font-family="Consolas, monospace" font-size="16" fill="#e30613">03</text>
  <text x="112" y="246" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Buat backup</text>
  <text x="74" y="278" font-family="Consolas, monospace" font-size="16" fill="#e30613">04</text>
  <text x="112" y="278" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Buka aplikasi updater</text>
  <text x="74" y="310" font-family="Consolas, monospace" font-size="16" fill="#e30613">05</text>
  <text x="112" y="310" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Unduh update resmi</text>
  <text x="74" y="342" font-family="Consolas, monospace" font-size="16" fill="#e30613">06</text>
  <text x="112" y="342" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Instal update</text>
  <text x="74" y="374" font-family="Consolas, monospace" font-size="16" fill="#e30613">07</text>
  <text x="112" y="374" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Reboot</text>
  <text x="74" y="406" font-family="Consolas, monospace" font-size="16" fill="#e30613">08</text>
  <text x="112" y="406" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Verifikasi fungsi dasar</text>

  <rect x="520" y="100" width="430" height="330" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="520" y="100" width="430" height="50" fill="#000"/>
  <text x="544" y="134" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="1" fill="#fff">LEWAT RECOVERY</text>
  <text x="544" y="182" font-family="Consolas, monospace" font-size="16" fill="#e30613">01</text>
  <text x="582" y="182" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Unduh ROM versi baru</text>
  <text x="544" y="214" font-family="Consolas, monospace" font-size="16" fill="#e30613">02</text>
  <text x="582" y="214" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Siapkan recovery yang diwajibkan</text>
  <text x="544" y="246" font-family="Consolas, monospace" font-size="16" fill="#e30613">03</text>
  <text x="582" y="246" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Masuk recovery</text>
  <text x="544" y="278" font-family="Consolas, monospace" font-size="16" fill="#e30613">04</text>
  <text x="582" y="278" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Aktifkan sideload bila diminta</text>
  <text x="544" y="310" font-family="Consolas, monospace" font-size="16" fill="#e30613">05</text>
  <text x="582" y="310" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Kirim paket ROM</text>
  <text x="544" y="342" font-family="Consolas, monospace" font-size="16" fill="#e30613">06</text>
  <text x="582" y="342" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Pasang add-on bila wajib</text>
  <text x="544" y="374" font-family="Consolas, monospace" font-size="16" fill="#e30613">07</text>
  <text x="582" y="374" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Selesaikan langkah lanjutan</text>
  <text x="544" y="406" font-family="Consolas, monospace" font-size="16" fill="#e30613">08</text>
  <text x="582" y="406" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Verifikasi sistem</text>

  <rect x="50" y="450" width="900" height="60" fill="#e30613"/>
  <text x="70" y="488" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#fff">Updater untuk jalur sama; upgrade besar ikuti panduan manual.</text>
</svg>
