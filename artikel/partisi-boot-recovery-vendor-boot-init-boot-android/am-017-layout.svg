  <text x="690" y="306" font-family="Consolas, monospace" font-size="20" fill="#000">init_boot</text>
  <text x="690" y="336" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#000">generic ramdisk</text>

  <rect x="670" y="370" width="280" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="690" y="396" font-family="Consolas, monospace" font-size="20" fill="#000">vendor_boot</text>
  <text x="690" y="426" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#000">komponen vendor</text>

