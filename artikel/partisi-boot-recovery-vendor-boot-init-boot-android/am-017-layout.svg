  <rect x="50" y="280" width="280" height="80" fill="#ffd400" stroke="#000" stroke-width="2"/>
  <text x="70" y="306" font-family="Consolas, monospace" font-size="20" fill="#000">recovery</text>
  <text x="70" y="336" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#000">recovery</text>

  <rect x="50" y="370" width="280" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="70" y="396" font-family="Consolas, monospace" font-size="20" fill="#000">vendor_boot</text>
  <text x="70" y="426" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#000">komponen vendor</text>

  <rect x="360" y="190" width="280" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="380" y="216" font-family="Consolas, monospace" font-size="20" fill="#000">boot</text>
  <text x="380" y="242" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">kernel, ramdisk,</text>
  <text x="380" y="262" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">+ recovery</text>

  <rect x="360" y="280" width="280" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="380" y="326" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">tanpa partisi</text>
  <text x="380" y="346" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">recovery terpisah</text>

  <rect x="360" y="370" width="280" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="380" y="396" font-family="Consolas, monospace" font-size="20" fill="#000">vendor_boot</text>
  <text x="380" y="426" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#000">komponen vendor</text>

  <rect x="670" y="190" width="280" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="690" y="216" font-family="Consolas, monospace" font-size="20" fill="#000">boot</text>
  <text x="690" y="246" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#000">kernel</text>

