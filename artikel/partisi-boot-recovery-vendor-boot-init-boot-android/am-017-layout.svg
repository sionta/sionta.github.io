<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Tiga layout partisi boot: partisi recovery terpisah, recovery-as-boot, dan layout yang memakai init_boot">
  <rect width="1000" height="560" fill="#fff"/>
  <text x="50" y="52" font-family="Consolas, monospace" font-size="22" letter-spacing="2" fill="#000">TIGA LAYOUT PARTISI BOOT</text>
  <line x1="50" y1="72" x2="950" y2="72" stroke="#000" stroke-width="4"/>

  <rect x="50" y="100" width="280" height="70" fill="#000"/>
  <text x="70" y="130" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff">Partisi recovery</text>
  <text x="70" y="156" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff">terpisah</text>

  <rect x="360" y="100" width="280" height="70" fill="#000"/>
  <text x="380" y="143" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#fff">Recovery-as-boot</text>

