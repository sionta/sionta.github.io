<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Delapan langkah aman kembali ke stock ROM: catat model dan region, periksa firmware, cari firmware resmi, periksa risiko downgrade, backup, pakai alat resmi, ikuti instruksi, verifikasi">
  <rect width="1000" height="440" fill="#fff"/>
