<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-label="Tiga lapisan yang harus benar agar perangkat terdeteksi: fisik, mode perangkat, dan perangkat lunak komputer">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1000" height="490" fill="#fff"/>
  <text x="50" y="52" font-family="Consolas, monospace" font-size="22" letter-spacing="2" fill="#000">TIGA LAPISAN YANG HARUS BENAR</text>
  <line x1="50" y1="72" x2="950" y2="72" stroke="#000" stroke-width="4"/>

  <rect x="50" y="100" width="280" height="150" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="72" y="152" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#000">Fisik</text>
  <text x="72" y="192" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">kabel data,</text>
  <text x="72" y="218" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">port, daya</text>

  <rect x="360" y="100" width="280" height="150" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="382" y="152" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#000">Mode perangkat</text>
  <text x="382" y="192" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">Android, bootloader,</text>
  <text x="382" y="218" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">recovery</text>

  <rect x="670" y="100" width="280" height="150" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="692" y="152" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#000">Komputer</text>
  <text x="692" y="192" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">driver dan</text>
  <text x="692" y="218" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">izin akses</text>

  <line x1="190" y1="250" x2="190" y2="296" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="500" y1="250" x2="500" y2="296" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="810" y1="250" x2="810" y2="296" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="50" y="310" width="900" height="70" fill="#ffd400" stroke="#000" stroke-width="2"/>
  <text x="74" y="352" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#000">Perangkat terdeteksi ADB atau Fastboot</text>

  <rect x="50" y="410" width="900" height="60" fill="#e30613"/>
  <text x="70" y="448" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#fff">Satu lapisan gagal, gejalanya sama.</text>
</svg>
