<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Bootloader memilih tiga jalur boot: Android normal, recovery, atau mode Fastboot">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#fff"/>
  <text x="50" y="52" font-family="Consolas, monospace" font-size="22" letter-spacing="2" fill="#000">BOOTLOADER MEMILIH JALUR BOOT</text>
  <line x1="50" y1="72" x2="950" y2="72" stroke="#000" stroke-width="4"/>

  <rect x="50" y="125" width="190" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="68" y="159" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#000">Daya</text>
  <text x="68" y="185" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#000">dinyalakan</text>

  <line x1="240" y1="165" x2="292" y2="165" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="300" y="105" width="200" height="120" fill="#000"/>
  <text x="320" y="173" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#fff">Bootloader</text>

  <path d="M500 165 H545 V130 H578" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M500 165 H545 V255 H578" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M500 165 H545 V380 H578" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="590" y="90" width="360" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="610" y="139" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#000">Android normal</text>

  <rect x="590" y="215" width="360" height="80" fill="#ffd400" stroke="#000" stroke-width="2"/>
  <text x="610" y="264" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#000">Recovery</text>

  <rect x="590" y="340" width="360" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="610" y="389" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#000">Mode Fastboot</text>

  <rect x="50" y="440" width="900" height="60" fill="#e30613"/>
  <text x="70" y="478" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#fff">Recovery hanya berjalan setelah bootloader memilihnya.</text>
</svg>
