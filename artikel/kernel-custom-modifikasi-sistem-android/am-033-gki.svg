<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-label="Hubungan kernel generik GKI dan modul vendor melalui KMI, serta gejala bila keduanya tidak cocok">
  <rect width="1000" height="490" fill="#fff"/>
  <text x="50" y="52" font-family="Consolas, monospace" font-size="22" letter-spacing="2" fill="#000">KERNEL GENERIK DAN MODUL VENDOR</text>
  <line x1="50" y1="72" x2="950" y2="72" stroke="#000" stroke-width="4"/>

  <rect x="50" y="100" width="560" height="90" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="72" y="140" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#000">Kernel generik (GKI)</text>
  <text x="72" y="172" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">kernel Linux + patch Android</text>

  <rect x="50" y="205" width="560" height="50" fill="#ffd400" stroke="#000" stroke-width="2"/>
  <text x="72" y="238" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#000">KMI — Kernel Module Interface</text>

  <rect x="50" y="270" width="560" height="105" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="72" y="310" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#000">Modul vendor</text>
  <text x="72" y="342" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">modem, kamera, audio, sensor</text>

  <rect x="650" y="100" width="300" height="275" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="672" y="140" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#000">Bila KMI tidak cocok</text>
  <text x="672" y="186" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">Gagal boot</text>
  <text x="672" y="222" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">Kamera mati</text>
  <text x="672" y="258" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">Tidak ada sinyal</text>
  <text x="672" y="294" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">Audio mati</text>
  <text x="672" y="330" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000">Sensor mati</text>

  <rect x="50" y="410" width="900" height="60" fill="#e30613"/>
  <text x="70" y="448" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#fff">Kernel custom harus cocok dengan modul vendor perangkat.</text>
</svg>
